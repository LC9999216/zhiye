services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhibian-postgres
    environment:
      POSTGRES_DB: zhibian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: zhibian-api
    environment:
      APP_MODE: mock
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/zhibian
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations on start (single-process, no external task queue).
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

  web:
    image: node:24-alpine
    container_name: zhibian-web
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
